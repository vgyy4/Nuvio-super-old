name: Recover NUVIO_LOCAL_PROPERTIES_BASE64 to NuvioMobile

# Manual, one-off recovery tool. Run it once from the Actions tab, then delete this
# file and the FINE_GRAINED_TOKEN secret - it has no reason to exist after that.
on:
  workflow_dispatch:

permissions: {}

jobs:
  copy-secret:
    name: Copy the secret to vgyy4/NuvioMobile
    runs-on: ubuntu-latest
    env:
      # The PAT used to write to the *other* repo. This repo's own secret
      # (NUVIO_LOCAL_PROPERTIES_BASE64 below) needs no token: a workflow always has
      # automatic read access to its own repo's secrets.
      GH_TOKEN: ${{ secrets.FINE_GRAINED_TOKEN }}
      SOURCE_VALUE: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
    steps:
      - name: Verify both secrets are present (no values printed)
        run: |
          missing=()
          [[ -z "${GH_TOKEN}" ]] && missing+=("FINE_GRAINED_TOKEN")
          [[ -z "${SOURCE_VALUE}" ]] && missing+=("NUVIO_LOCAL_PROPERTIES_BASE64")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing secret(s) on this repo: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "Both secrets are present; proceeding."

      - name: Copy NUVIO_LOCAL_PROPERTIES_BASE64 into vgyy4/NuvioMobile
        run: |
          # Piped straight into gh's stdin: the value is never a command-line argument
          # and is never echoed. gh encrypts it client-side (against NuvioMobile's
          # public key) before it ever leaves this runner.
          printf '%s' "${SOURCE_VALUE}" | gh secret set NUVIO_LOCAL_PROPERTIES_BASE64 --repo vgyy4/NuvioMobile

      - name: Done
        run: |
          echo "NUVIO_LOCAL_PROPERTIES_BASE64 is now set on vgyy4/NuvioMobile."
          echo "Next: delete this workflow file and the FINE_GRAINED_TOKEN secret - both are single-use."
